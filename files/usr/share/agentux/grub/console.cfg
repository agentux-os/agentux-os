# AgentUX: the GRUB menu in the AgentUX look. bootupd's static grub.cfg
# sources this file ("GRUB console settings provided by the user/platform")
# before it draws the menu; agentux-grub-theme.service keeps it and
# grub2/agentux/ in step with the booted image. Edit or replace it to keep
# GRUB's plain menu or to use console settings of your own: the service then
# leaves it alone. Anything here that fails (no graphics, a missing file)
# leaves GRUB's text menu as it was.
set agentux_theme="$prefix/agentux"
if [ -f "$agentux_theme/theme.txt" ] && loadfont "$agentux_theme/unicode.pf2"; then
  insmod all_video
  insmod gfxterm
  insmod gfxmenu
  insmod png
  set gfxmode=auto
  if terminal_output gfxterm; then
    set theme="$agentux_theme/theme.txt"
    export theme
  fi
fi
