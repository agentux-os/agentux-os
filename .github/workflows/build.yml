name: Build image

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # daily, to pick up Fedora updates
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/agentux

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build
        run: podman build --tag agentux:ci .

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
          tag="$(date -u +%Y%m%d)"
          for t in latest "$tag"; do
            podman push agentux:ci "docker://${IMAGE}:${t}"
          done

  # Boots nothing: runs the image as a plain container, does a real first
  # login as a fresh user and checks every CLI resolves from a login shell.
  # Rebuilding here is cheaper than shipping a multi-GB image between jobs
  # as an artifact; the base layers come from quay.io's CDN either way.
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build
        run: podman build --tag agentux:ci .

      - name: First login and tool checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          podman run --rm --env GITHUB_TOKEN --env SMOKE_SUMMARY=/out/summary.md \
            -v ./tests:/tests:ro -v "$RUNNER_TEMP/smoke:/out" agentux:ci /tests/smoke.sh

      - name: Summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/smoke/summary.md" ]]; then
            { echo "## AgentUX smoke test"; echo; cat "$RUNNER_TEMP/smoke/summary.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi

  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck files/usr/libexec/agentux/* files/etc/profile.d/agentux.sh tests/*.sh

      - name: hadolint
        run: docker run --rm -v "$PWD:/src:ro" -w /src hadolint/hadolint:v2.15.1 hadolint Containerfile
