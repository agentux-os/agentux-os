name: Release

# A v* tag, from main's tested image to the stable channel. Build once,
# promote: the release builds no image. It ships the very digest that main
# built, signed, smoke-tested and published for the tagged commit
# (sha-<commit>, see build.yml), so :stable is exactly what was tested and
# not a fresh build that would pull newer Fedora packages.
#
#   1. candidate the tag must be on main and main must have published
#                sha-<commit> for it; resolve its image to its digest
#                once and check its signatures (the AgentUX key and
#                keyless).
#   2. boot      boot.yml boots that plasma digest in QEMU/KVM and runs
#                tests/boot.sh on it.
#      iso, live the installer and live ISOs (Plasma, x86_64 and
#                aarch64), built from the plasma digest and following
#                :stable; x86_64 ISOs are installed in a VM. COSMIC remains
#                nightly-only. ISOs are only built here.
#   3. release   waits for the owner's approval (the `release` environment:
#                v* tags only, wendelmax as required reviewer), then moves
#                :<tag> and :stable to the digests, publishes the ISOs in
#                iso/<tag>/ and iso/stable/ on download.agentuxos.org (with a
#                signed SHA256SUMS in each), creates the GitHub release and
#                points latest.json at it.
#
# Approving is the last step, after every test of the tag passed; rejecting
# it (or letting it time out) leaves :stable, the downloads and the releases
# untouched. :latest is not involved: it stays the nightly channel that
# build.yml moves from main.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  candidate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      plasma: ${{ steps.digests.outputs.plasma }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only reviewed code is released: the tagged commit must be on main.
      - name: Check the tag is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; tag a commit of main"
            exit 1
          fi

      - uses: sigstore/cosign-installer@v4.1.2

      # build.yml tags sha-<commit> only after the image passed the smoke
      # tests and its signatures were checked against the shipped policy.
      - name: Resolve main's image for the tagged commit
        id: digests
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          tag="sha-${GITHUB_SHA::12}"
          for pair in plasma=agentux; do
            repo="ghcr.io/$OWNER/${pair#*=}"
            if ! raw="$(skopeo inspect --raw --creds "${{ github.actor }}:$TOKEN" "docker://$repo:$tag")"; then
              echo "::error::$repo:$tag does not exist: main has not published an image for $GITHUB_SHA (wait for its Build image run, or tag a commit that has one)"
              exit 1
            fi
            digest="sha256:$(printf '%s' "$raw" | sha256sum | cut -d' ' -f1)"
            cosign verify --key files/etc/pki/containers/agentux-os.pub "$repo@$digest" > /dev/null
            cosign verify "$repo@$digest" \
              --certificate-identity-regexp "^https://github.com/$GITHUB_REPOSITORY/\.github/workflows/build\.yml@refs/heads/main$" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "$repo:$tag -> $digest (signed with the AgentUX key and by main's build.yml)"
            echo "${pair%%=*}=$digest" >> "$GITHUB_OUTPUT"
            echo "- \`$repo@$digest\` (\`$tag\`)" >> "$GITHUB_STEP_SUMMARY"
          done

  # The image the release ships, booted for real.
  boot:
    needs: candidate
    uses: ./.github/workflows/boot.yml
    permissions:
      contents: read
      packages: read
    with:
      image: ghcr.io/${{ github.repository_owner }}/agentux@${{ needs.candidate.outputs.plasma }}

  iso-plasma:
    needs: candidate
    uses: ./.github/workflows/iso.yml
    permissions:
      contents: read
      packages: read
      actions: read
    with:
      variant: plasma
      image: ghcr.io/${{ github.repository_owner }}/agentux@${{ needs.candidate.outputs.plasma }}
      channel: stable
    secrets: inherit

  live-plasma:
    needs: candidate
    uses: ./.github/workflows/live.yml
    permissions:
      contents: read
      packages: read
      actions: read
    with:
      variant: plasma
      arch: both
      image: ghcr.io/${{ github.repository_owner }}/agentux@${{ needs.candidate.outputs.plasma }}
      channel: stable
    secrets: inherit

  # The gate: this job waits for the owner's approval in the `release`
  # environment. Its R2 credentials (and a copy of the signing key) are
  # environment secrets, so only an approved v* tag run can publish.
  release:
    needs: [candidate, boot, iso-plasma, live-plasma]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write # the GitHub release
      packages: write # the :<tag> and :stable tags
      actions: read # the ISO artifacts of this run
    env:
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      # The publishing scripts come from main, not from the tag: they are
      # release tooling, not part of the released system, so a fix to them
      # on main lets a failed publish be re-run without a new tag. (The
      # tag's image, ISOs and public key are what get published.)
      # Also the release highlights (docs/releases/<tag>.md), which may be
      # merged after the tag, until the approval.
      - name: Use main's publishing scripts and release highlights
        run: |
          git fetch --quiet --depth=1 origin main
          git restore --source=FETCH_HEAD -- .github/scripts
          git restore --source=FETCH_HEAD -- docs/releases 2>/dev/null || true
          git log -1 --format='publishing scripts from main at %h %s' FETCH_HEAD

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/.ghcup /usr/local/share/powershell /usr/local/julia* \
            /usr/lib/jvm /opt/microsoft /opt/google /opt/az
          sudo docker image prune --all --force
          df -h /

      - uses: sigstore/cosign-installer@v4.1.2

      # First the images, so :stable exists before any ISO that follows it
      # can be downloaded.
      - name: Promote the images to :${{ github.ref_name }} and :stable
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLASMA: ${{ needs.candidate.outputs.plasma }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          echo "$TOKEN" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
          echo "## Promoted" >> "$GITHUB_STEP_SUMMARY"
          .github/scripts/promote.sh "ghcr.io/$OWNER/agentux" "$PLASMA" "$GITHUB_REF_NAME" stable

      - uses: actions/download-artifact@v4
        with:
          pattern: agentux*-${{ github.ref_name }}-*
          path: ${{ runner.temp }}/isos
          merge-multiple: true

      - name: Publish the ISOs and the GitHub release
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          PLASMA_DIGEST: ${{ needs.candidate.outputs.plasma }}
          EXPECT: >-
            agentux-${{ github.ref_name }}-x86_64 agentux-${{ github.ref_name }}-aarch64
            agentux-live-${{ github.ref_name }}-x86_64 agentux-live-${{ github.ref_name }}-aarch64
        run: |
          ls -lh "$RUNNER_TEMP/isos"
          echo "## Published" >> "$GITHUB_STEP_SUMMARY"
          .github/scripts/publish-iso.sh release "$RUNNER_TEMP/isos"
