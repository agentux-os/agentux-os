name: Build image

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # daily, to pick up Fedora updates
  workflow_dispatch:

# Three images from the one Containerfile (build arg VARIANT): Plasma,
# Hyprland, and COSMIC each have a separate repository. All are built and
# signed on nightly/test channels; release.yml deliberately promotes only
# Plasma and Hyprland until COSMIC passes its launch gate.
env:
  # Pushes from main (push, schedule, dispatch) publish, once signed,
  # verified and smoke-tested, a dated tag, sha-<commit> and :latest. A
  # release (release.yml, on a v* tag) builds nothing: it promotes the
  # sha-<commit> image of the tagged commit to :<tag> and :stable. A dispatch
  # from any other branch (gh workflow run build.yml --ref <branch>) pushes
  # only test-<sha> (and its per-architecture test-<sha>-<arch>) to exercise
  # signing and the policy, and never touches :latest or a dated tag.
  PUBLISH: ${{ github.event_name != 'pull_request' }}
  RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  contracts:
    name: desktop bundle contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contract and atomic pin tests
        run: |
          node tests/desktop-bundles-contract.mjs
          node tests/cosmic-contract.mjs
          node tests/build-workflow-contract.mjs
          tests/bump-agentux.sh

  # One native build per architecture: no QEMU emulation, so the arm64 image
  # is built (and its RPM scriptlets run) on real aarch64. Each leg pushes its
  # image under a staging tag (ci-staging-<arch> from main, test-<sha>-<arch>
  # otherwise) and hands its digest to `publish`, which only works by digest.
  image:
    name: image (${{ matrix.variant }}, ${{ matrix.arch }})
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        variant: [plasma, hyprland, cosmic]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - variant: plasma
            image: agentux
          - variant: hyprland
            image: agentux-hyprland
          - variant: cosmic
            arch: amd64
            runner: ubuntu-24.04
            image: agentux-cosmic
          - variant: cosmic
            arch: arm64
            runner: ubuntu-24.04-arm
            image: agentux-cosmic
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          start=$SECONDS
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          echo "Image job disk cleanup: $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve COSMIC Atomic base
        id: cosmic-base
        if: matrix.variant == 'cosmic'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          image="$(.github/scripts/resolve-cosmic-base.sh "$ARCH")"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Resolved Fedora COSMIC Atomic ($ARCH): \`$image\` (upstream Quay retention: 4 weeks)." >> "$GITHUB_STEP_SUMMARY"

      # quay.io's CDN drops blob downloads now and then; pull the base with
      # retries so `podman build` starts from a local copy.
      - name: Pull the base image
        env:
          BASE_IMAGE: ${{ steps.cosmic-base.outputs.image }}
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = cosmic ]; then .github/scripts/pull.sh "$BASE_IMAGE"
          else .github/scripts/pull.sh; fi

      # The image's own version (os-release IMAGE_VERSION, the
      # org.opencontainers.image.version label): the build's date and commit,
      # e.g. 2026.10.15.063578e. A release promotes this image unchanged, so
      # the release name is not in it (ADR 0012, agentux-version).
      - name: Build
        env:
          BASE_IMAGE: ${{ steps.cosmic-base.outputs.image }}
          VARIANT: ${{ matrix.variant }}
        run: |
          args=(--build-arg "VARIANT=$VARIANT")
          if [ "$VARIANT" = cosmic ]; then args+=(--build-arg "BASE_IMAGE=$BASE_IMAGE"); fi
          podman build "${args[@]}" \
            --build-arg AGENTUX_VERSION="$(date -u +%Y.%m.%d).${GITHUB_SHA::7}" \
            --build-arg AGENTUX_COMMIT="$GITHUB_SHA" \
            --tag agentux:ci .
          test "$(podman image inspect --format '{{.Architecture}}' agentux:ci)" = "${{ matrix.arch }}"

      - name: Capture built image identity
        run: |
          image_id="$(podman image inspect --format '{{.Id}}' agentux:ci)"
          printf '%s\n' "$image_id" > "$RUNNER_TEMP/image-id-before-tests"
          echo "Built local image ID: \`$image_id\`" >> "$GITHUB_STEP_SUMMARY"

      - name: First login and tool checks
        env:
          # The image job needs packages:write for Push. Do not expose that
          # token to PR or non-main branch image code running in the container.
          GITHUB_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.GITHUB_TOKEN || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          podman run --rm --env GITHUB_TOKEN --env SMOKE_SUMMARY=/out/summary.md --env SMOKE_VARIANT=${{ matrix.variant }} \
            -v ./tests:/tests:ro -v "$RUNNER_TEMP/smoke:/out" agentux:ci /tests/smoke.sh

      - name: Installation profile contract
        run: podman run --rm -v "$PWD:/src:ro" agentux:ci /src/tests/profile.sh

      - name: Verify tested image identity
        run: |
          before="$(cat "$RUNNER_TEMP/image-id-before-tests")"
          after="$(podman image inspect --format '{{.Id}}' agentux:ci)"
          test "$before" = "$after" || {
            echo "::error::local image changed during smoke tests ($before -> $after)"
            exit 1
          }
          echo "Smoke tests used the built image ID: \`$after\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/smoke/summary.md" ]]; then
            { echo "## AgentUX smoke test (${{ matrix.variant }}, ${{ matrix.arch }})"; echo; cat "$RUNNER_TEMP/smoke/summary.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push
        if: env.PUBLISH == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "$TOKEN" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
          if [ "$RELEASE" = true ]; then stage=ci-staging
          else stage="test-${GITHUB_SHA::12}"; fi
          mkdir -p "$RUNNER_TEMP/digests"
          podman push --digestfile "$RUNNER_TEMP/digests/$ARCH" agentux:ci "docker://${IMAGE}:${stage}-${ARCH}"
          echo "pushed ${IMAGE}:${stage}-${ARCH}@$(cat "$RUNNER_TEMP/digests/$ARCH")"

      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  # Joins the per-architecture images into one manifest list, signs the list
  # and every image in it, checks the signatures with cosign and with the
  # policy the image ships (for each architecture), and only then moves the
  # public tags to the list, digest unchanged. The image matrix has already
  # passed its smoke and profile-contract checks before pushing.
  # No `name:` with matrix values here: a job skipped by its `if` (on pull
  # requests) never expands its matrix, so the check would read
  # "publish (${{ matrix.variant }})". GitHub's default name lists the matrix
  # values when it runs ("publish (plasma, agentux)") and says "publish" when
  # skipped.
  publish:
    # Image smoke tests gate the public tags: a commit whose image fails them
    # never reaches :latest, sha-<commit> or a release.
    needs: [image]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: plasma
            image: agentux
          - variant: hyprland
            image: agentux-hyprland
          - variant: cosmic
            image: agentux-cosmic
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Main's runs share the ci-staging tags; one at a time per repository.
    concurrency:
      group: publish-${{ github.ref }}-${{ matrix.variant }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing with this workflow's OIDC identity
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      # The policy check below pulls whole images, twice per architecture.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/.ghcup /usr/local/share/powershell /usr/local/julia* \
            /usr/lib/jvm /opt/microsoft /opt/google /opt/az
          sudo docker image prune --all --force
          df -h / /mnt

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.variant }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Create the manifest list
        id: list
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
          # cosign and buildx read Docker's credential file, not Podman's.
          echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          amd64="$(cat "$RUNNER_TEMP/digests/amd64")"
          arm64="$(cat "$RUNNER_TEMP/digests/arm64")"
          if [ "$RELEASE" = true ]; then tag=ci-staging
          else tag="test-${GITHUB_SHA::12}"; fi
          # imagetools references the pushed images as they are: their
          # digests, and so their signatures, stay valid inside the list.
          docker buildx imagetools create --tag "${IMAGE}:${tag}" \
            "${IMAGE}@${amd64}" "${IMAGE}@${arm64}"
          # ghcr.io can answer "manifest unknown" for a moment right after
          # the push (seen on the first v* tag); retry the read.
          for i in 1 2 3 4 5 6; do
            skopeo inspect --raw "docker://${IMAGE}:${tag}" > "$RUNNER_TEMP/list.json" && break
            [ "$i" = 6 ] && exit 1
            sleep $((i * 5))
          done
          digest="sha256:$(sha256sum "$RUNNER_TEMP/list.json" | cut -d' ' -f1)"
          raw="$(cat "$RUNNER_TEMP/list.json")"
          jq . <<<"$raw"
          # Exactly the two images, each under its own platform.
          for pair in "amd64=$amd64" "arm64=$arm64"; do
            jq -e --arg a "${pair%%=*}" --arg d "${pair#*=}" \
              '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a)] | length == 1 and .[0].digest == $d' \
              <<<"$raw" > /dev/null || { echo "::error::the list has no linux/${pair%%=*} entry with ${pair#*=}"; exit 1; }
          done
          jq -e '.manifests | length == 2' <<<"$raw" > /dev/null
          {
            echo "tag=$tag"
            echo "digest=$digest"
            echo "amd64=$amd64"
            echo "arm64=$arm64"
          } >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v4.1.2

      # Two signatures on each digest (the list and both images), all in the
      # classic .sig tag that containers/image reads (hence no new bundle
      # format): a keyless one, tied to this workflow by Fulcio and Rekor, for
      # `cosign verify`; and one with the AgentUX key, the only kind the
      # policy installed systems enforce can check. containers/image checks
      # the signature of the image it picks from the list for its
      # architecture, not the list's, so every image is signed explicitly.
      - name: Sign
        env:
          DIGESTS: ${{ steps.list.outputs.digest }} ${{ steps.list.outputs.amd64 }} ${{ steps.list.outputs.arm64 }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::error::the COSIGN_PRIVATE_KEY secret is not set; installed systems would refuse this image"
            exit 1
          fi
          legacy=(--new-bundle-format=false --use-signing-config=false)
          for digest in $DIGESTS; do
            cosign sign --yes "${legacy[@]}" "${IMAGE}@${digest}"
            cosign sign --yes "${legacy[@]}" --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${digest}"
          done

      - name: Verify with cosign
        env:
          DIGESTS: ${{ steps.list.outputs.digest }} ${{ steps.list.outputs.amd64 }} ${{ steps.list.outputs.arm64 }}
          # This workflow's own identity, also when release.yml calls it
          # (Fulcio names the called workflow, github.workflow_ref the caller).
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build.yml@${{ github.ref }}
        run: |
          for digest in $DIGESTS; do
            cosign verify --key files/etc/pki/containers/agentux-os.pub "${IMAGE}@${digest}" > /dev/null
            cosign verify "${IMAGE}@${digest}" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "${IMAGE}@${digest}: key and keyless signatures verified"
          done

      # The check that matters: what an installed system's `bootc upgrade`
      # would do with the policy shipped in this very image, once per
      # architecture (skopeo --override-arch picks that architecture's image
      # from the list, as a system of that architecture would). An unsigned
      # image in the same repository must be refused.
      - name: Verify with the shipped policy
        env:
          AUTHFILE: ${{ runner.temp }}/auth.json
          WORKDIR: /mnt/sigpolicy
          TAG: ${{ steps.list.outputs.tag }}
          DIGEST: ${{ steps.list.outputs.digest }}
          AMD64: ${{ steps.list.outputs.amd64 }}
        run: |
          cp "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/containers/auth.json" "$AUTHFILE"
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$WORKDIR"
          skopeo copy --quiet docker://quay.io/libpod/alpine:latest "docker://${IMAGE}:ci-unsigned"
          .github/scripts/pull.sh "${IMAGE}@${AMD64}"
          podman tag "${IMAGE}@${AMD64}" agentux:ci
          for arch in amd64 arm64; do
            echo "::group::linux/$arch"
            ARCH="$arch" tests/sigpolicy.sh agentux:ci "$IMAGE" "$DIGEST" "$TAG" ci-unsigned
            echo "::endgroup::"
          done

      - name: Tag the release
        if: env.RELEASE == 'true'
        env:
          DIGEST: ${{ steps.list.outputs.digest }}
        run: |
          # sha-<commit> is what a release of this commit promotes.
          for tag in "$(date -u +%Y%m%d)" "sha-${GITHUB_SHA::12}" latest; do
            skopeo copy --quiet --all --preserve-digests "docker://${IMAGE}@${DIGEST}" "docker://${IMAGE}:${tag}"
            # The new tag can read as unknown for a moment after the copy.
            for i in 1 2 3 4 5 6; do
              got="$(skopeo inspect --raw "docker://${IMAGE}:${tag}" | sha256sum | cut -d' ' -f1)" && [ "$got" = "${DIGEST#sha256:}" ] && break
              [ "$i" = 6 ] && { echo "::error::${IMAGE}:${tag} does not resolve to ${DIGEST}"; exit 1; }
              sleep $((i * 5))
            done
            echo "${IMAGE}:${tag} -> ${DIGEST}"
          done

      - name: Summary
        env:
          TAG: ${{ steps.list.outputs.tag }}
          DIGEST: ${{ steps.list.outputs.digest }}
          AMD64: ${{ steps.list.outputs.amd64 }}
          ARM64: ${{ steps.list.outputs.arm64 }}
        run: |
          {
            echo "## Published \`${IMAGE}\`"
            echo
            echo "| | Digest |"
            echo "|---|---|"
            echo "| list (\`${TAG}\`$([ "$RELEASE" = true ] && echo ", \`$(date -u +%Y%m%d)\`, \`latest\`")) | \`${DIGEST}\` |"
            echo "| linux/amd64 | \`${AMD64}\` |"
            echo "| linux/arm64 | \`${ARM64}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The required check. A matrix job's checks are named "image (plasma,
  # amd64)" and so on, so this one carries the name branch protection asks
  # for: every variant built for every architecture and, outside pull
  # requests, both lists published.
  build:
    needs: [image, publish]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Check the builds
        env:
          IMAGE_RESULT: ${{ needs.image.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          echo "image: $IMAGE_RESULT, publish: $PUBLISH_RESULT"
          test "$IMAGE_RESULT" = success
          if [ "$PUBLISH" = true ]; then
            test "$PUBLISH_RESULT" = success
          else
            test "$PUBLISH_RESULT" = skipped
          fi

  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: COSMIC variant contract
        run: node tests/cosmic-contract.mjs

      - name: Build workflow contract
        run: node tests/build-workflow-contract.mjs

      - name: Release workflow contract
        run: node tests/release-workflow-contract.mjs

      - name: shellcheck
        run: |
          shellcheck installer/brand-iso.sh files/usr/bin/agentux-version files/usr/bin/agentux files/usr/libexec/agentux/* files/etc/profile.d/agentux.sh tests/*.sh variants/hyprland/usr/libexec/agentux/* .github/scripts/*.sh live/build.sh live/files/usr/libexec/agentux/*
          shellcheck --shell=sh live/livesys-session-extra

      - name: hadolint
        run: docker run --rm -v "$PWD:/src:ro" -w /src hadolint/hadolint:v2.15.1 hadolint Containerfile live/Containerfile

      # The list a release publishes (publish-iso.sh), built here from the
      # registry's current v* tags, so a broken script shows up before a
      # release needs it.
      - name: releases.json
        run: |
          .github/scripts/releases-json.sh "$RUNNER_TEMP/releases.json"
          jq . "$RUNNER_TEMP/releases.json"
