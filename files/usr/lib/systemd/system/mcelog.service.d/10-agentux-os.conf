# mcelog does not support current AMD CPUs ("Please use the edac_mce_amd module
# instead") and exits with an error, which leaves the whole system "degraded"
# on every AMD machine. The kernel's EDAC driver covers those; skip mcelog there.
[Service]
ExecCondition=/usr/bin/sh -c '! grep -q "^vendor_id.*AuthenticAMD" /proc/cpuinfo'
