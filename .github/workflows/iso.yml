name: Build ISO

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Image variant to build the installer from (plasma is ghcr.io/agentux-os/agentux, hyprland is ghcr.io/agentux-os/agentux-hyprland)
        type: choice
        options: [plasma, hyprland]
        default: plasma
      image:
        description: Image to build the installer from instead of the variant's :latest (e.g. a test-<sha> tag or a digest)
        default: ""
      channel:
        description: Channel the installed system follows (stable falls back to latest while no :stable exists)
        type: choice
        options: [latest, stable]
        default: latest
      publish:
        description: Publish the ISO on download.agentuxos.org (iso/nightly/; only from main)
        type: boolean
        default: false
  # A v* tag: release.yml calls this with the tag's candidate digest and the
  # stable channel, and publishes the ISOs itself once the release is approved.
  workflow_call:
    inputs:
      variant:
        type: string
        default: plasma
      image:
        type: string
        default: ""
      channel:
        type: string
        default: latest
  schedule:
    - cron: "30 9 * * 1" # weekly, Monday, after the nightly image build
  # Check that the installer still builds when its definition changes.
  pull_request:
    paths:
      - .github/workflows/iso.yml
      - .github/scripts/pull.sh
      - .github/scripts/channel.sh
      - disk_config/iso.toml

env:
  # What the ISO is built from: an explicit image (release.yml passes the
  # tag's digest), or the variant's :latest.
  IMAGE: ${{ inputs.image || (inputs.variant == 'hyprland' && 'ghcr.io/agentux-os/agentux-hyprland:latest') || 'ghcr.io/agentux-os/agentux:latest' }}
  REPO: ${{ inputs.variant == 'hyprland' && 'ghcr.io/agentux-os/agentux-hyprland' || 'ghcr.io/agentux-os/agentux' }}
  CHANNEL: ${{ inputs.channel || 'latest' }}
  # The ISO's file name: agentux-<version>-<arch> or agentux-hyprland-<version>-<arch>.
  ISO_PREFIX: ${{ inputs.variant == 'hyprland' && 'agentux-hyprland' || 'agentux' }}
  BIB: quay.io/centos-bootc/bootc-image-builder:latest

jobs:
  # One installer per architecture, each built natively: bootc-image-builder
  # builds for the machine it runs on, and pulling the image's manifest list
  # there picks the matching image.
  iso:
    name: iso (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            goarch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Images published before the multi-arch build are amd64 only. A pull
      # request (which builds from :latest) skips an architecture the image
      # does not have yet; a dispatch or a tag fails on it.
      - name: Check the image's architectures
        id: arch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          got="$(skopeo inspect --creds "${{ github.actor }}:$TOKEN" --override-arch "${{ matrix.goarch }}"             --format '{{.Architecture}}' "docker://$IMAGE")"
          if [ "$got" = "${{ matrix.goarch }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = pull_request ]; then
            echo "::notice::$IMAGE has no linux/${{ matrix.goarch }} image yet; skipping the ${{ matrix.arch }} ISO"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::$IMAGE has no linux/${{ matrix.goarch }} image (got $got)"
            exit 1
          fi

      # The channel the installed system follows (TRACK_IMAGE): :stable for
      # a release, :latest otherwise (see .github/scripts/channel.sh).
      - name: Pick the channel
        if: steps.arch.outputs.ok == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/channel.sh

      # The image, the builder and the ISO together need far more than the
      # ~20 GB a fresh runner has free.
      - name: Free disk space
        if: steps.arch.outputs.ok == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/.ghcup /usr/local/share/powershell /usr/local/julia* \
            /usr/lib/jvm /opt/microsoft /opt/google /opt/az
          sudo docker image prune --all --force
          df -h /

      # bootc-image-builder runs rootful and reads the image from root's
      # container storage. It names the image it was given in the installed
      # system's origin (the %post `bootc switch` of its kickstart), so the
      # image is tagged there as the channel it should follow: a release ISO
      # embeds the tag's digest and follows :stable.
      - name: Pull image
        if: steps.arch.outputs.ok == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | sudo podman login ghcr.io --username "${{ github.actor }}" --password-stdin
          # With retries: registry CDNs drop blob downloads now and then.
          sudo .github/scripts/pull.sh "$IMAGE" "$BIB"
          test "$(sudo podman image inspect --format '{{.Architecture}}' "$IMAGE")" = "${{ matrix.goarch }}"
          if [ "$IMAGE" != "$TRACK_IMAGE" ]; then
            sudo podman tag "$(sudo podman image inspect --format '{{.Id}}' "$IMAGE")" "$TRACK_IMAGE"
          fi
          sudo podman image ls

      - name: Build ISO
        if: steps.arch.outputs.ok == 'true'
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v ./disk_config/iso.toml:/config.toml:ro \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$BIB" \
            --type anaconda-iso \
            --rootfs btrfs \
            --use-librepo=True \
            --chown "$(id -u):$(id -g)" \
            "$TRACK_IMAGE"

      - name: Name and checksum the ISO
        if: steps.arch.outputs.ok == 'true'
        id: iso
        run: |
          # A tag build is named after the tag (its download links are known in
          # advance), any other after the day.
          version="$(date -u +%Y%m%d)"
          if [[ $GITHUB_REF == refs/tags/v* ]]; then version=$GITHUB_REF_NAME; fi
          name="${ISO_PREFIX}-${version}-${{ matrix.arch }}"
          mv output/bootiso/install.iso "$name.iso"
          sha256sum "$name.iso" > "$name.iso.sha256"
          ls -lh "$name.iso"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ISO \`$name.iso\` ($(du -h "$name.iso" | cut -f1)), installs \`$IMAGE\` and follows \`$TRACK_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.arch.outputs.ok == 'true'
        with:
          name: ${{ steps.iso.outputs.name }}
          path: |
            ${{ steps.iso.outputs.name }}.iso
            ${{ steps.iso.outputs.name }}.iso.sha256
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  # The weekly build and a dispatch with publish set go to iso/nightly/ on
  # download.agentuxos.org (.github/scripts/publish-iso.sh). Its R2
  # credentials live in the `nightly` environment, which only main can use.
  # Tags are published by release.yml, after approval.
  publish:
    needs: iso
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: nightly
    permissions:
      contents: read
      actions: read # the ISO artifacts of this run
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v4.1.2
      # This run's ISOs, as their jobs uploaded (and tested) them.
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.ISO_PREFIX }}-2*
          path: ${{ runner.temp }}/isos
          merge-multiple: true
      - name: Publish the ISOs
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-iso.sh nightly "$RUNNER_TEMP/isos"
