# hyprlock: the AgentUX lock screen (Super+Escape, or hypridle after 10
# minutes). Seeded from /usr/share/agentux/hyprland/user/ on your first
# Hyprland login; edit freely.

general {
    hide_cursor = true
}

background {
    monitor =
    path = /usr/share/agentux/hyprland/wallpaper.png
    color = rgb(0b0d10)
    blur_passes = 2
    brightness = 0.6
}

image {
    monitor =
    path = /usr/share/icons/hicolor/256x256/apps/agentux.png
    size = 96
    rounding = 0
    border_size = 0
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(e7eaef)
    font_size = 56
    font_family = Noto Sans
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    rounding = 8
    outer_color = rgb(c6f36b)
    inner_color = rgb(171b20)
    font_color = rgb(e7eaef)
    check_color = rgb(4f7d0b)
    fail_color = rgb(e5484d)
    placeholder_text = Password
    fade_on_empty = false
    position = 0, -60
    halign = center
    valign = center
}
