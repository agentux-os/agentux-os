# AgentUX defaults for Hyprland (the agentux-hyprland image).
#
# Your ~/.config/hypr/hyprland.conf sources this file first (the session
# seeds it from /usr/share/agentux/hyprland/user/hyprland.conf), so image
# updates reach you; anything you set after the `source` line wins.
#
# The layout is tuned for watching several agents at once: the master layout
# keeps one window (the cockpit, opened at login) large on the left and stacks
# every new window (agent terminals, logs) on the right. Super+M swaps the
# focused window into the master slot, Super+O rotates the master to the top,
# right or centre, Super+[ and Super+] resize it.
#
# Colours are the AgentUX brand's: Lime c6f36b, Ink 0b0d10, Graphite 171b20,
# Mist e7eaef, Slate 949dab.

monitor = , preferred, auto, auto

$terminal = foot
$menu = fuzzel
$cockpit = /usr/libexec/agentux/hyprland-cockpit
$wallpaper = /usr/share/agentux/hyprland/wallpaper.png

env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24
# Qt apps (the KDE ones in the image) take the AgentUX Plasma colours from
# /etc/xdg/kdeglobals through the KDE platform theme.
env = QT_QPA_PLATFORMTHEME, kde

# Portals and user services (agentuxd, the agent CLIs) need the session's
# Wayland display.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = swaybg --mode fill --image $wallpaper --color 0b0d10
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent.service
exec-once = wl-paste --watch cliphist store
exec-once = nm-applet --indicator
# The same wrapper as Plasma's autostart: skips system users, then opens the
# cockpit, which becomes the master window.
exec-once = /usr/libexec/agentux-cockpit-autostart

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgb(c6f36b)
    col.inactive_border = rgb(171b20)
    layout = master
    resize_on_border = true
}

decoration {
    rounding = 6
    inactive_opacity = 0.97

    shadow {
        enabled = false
    }

    blur {
        enabled = true
        size = 4
        passes = 2
    }
}

animations {
    enabled = true
    bezier = agentux, 0.2, 0.9, 0.1, 1.0
    animation = windows, 1, 3, agentux, popin 90%
    animation = fade, 1, 3, agentux
    animation = workspaces, 1, 3, agentux, slide
    animation = border, 1, 5, default
}

master {
    new_status = slave
    new_on_top = false
    mfact = 0.5
    orientation = left
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    background_color = rgb(0b0d10)
    focus_on_activate = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

input {
    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }
}

$mod = SUPER

# AgentUX: Super+A focuses the cockpit (or opens it), Super+Return a terminal.
bind = $mod, A, exec, $cockpit
bind = $mod, Return, exec, $terminal
bind = $mod, Space, exec, $menu
bind = $mod, D, exec, $menu
bind = $mod, Q, killactive,
bind = $mod, F, fullscreen, 0
bind = $mod, V, togglefloating,
bind = $mod SHIFT, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind = $mod, Escape, exec, loginctl lock-session
bind = $mod SHIFT, E, exit,

# Master layout: watching several agents.
bind = $mod, M, layoutmsg, swapwithmaster master
bind = $mod, O, layoutmsg, orientationnext
bind = $mod, bracketleft, layoutmsg, mfact -0.05
bind = $mod, bracketright, layoutmsg, mfact +0.05
bind = $mod, Tab, cyclenext,
bind = $mod SHIFT, Tab, cyclenext, prev

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshots of a region to the clipboard; Shift for the whole screen.
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
