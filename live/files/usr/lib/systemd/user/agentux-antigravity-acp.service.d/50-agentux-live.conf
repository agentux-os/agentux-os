# AgentUX live session only (live/build.sh): the Antigravity ACP server is a
# ~1 GB download that would sit in RAM (the live root is a tmpfs overlay), and
# the demo does not need it. live/build.sh also disables the unit; this keeps
# it from running even when started by hand or pulled in by first-login.
[Unit]
ConditionKernelCommandLine=!rd.live.image
