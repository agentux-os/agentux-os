name: Build image

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # daily, to pick up Fedora updates
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/agentux

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build
        run: podman build --tag agentux:ci .

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
          tag="$(date -u +%Y%m%d)"
          for t in latest "$tag"; do
            podman push agentux:ci "docker://${IMAGE}:${t}"
          done
