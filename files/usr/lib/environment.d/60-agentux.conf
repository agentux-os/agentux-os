# AgentUX: put the per-user tools installed by first-login (agent CLIs and ACP
# adapters in ~/.local/bin, mise-managed tools via its shims) on the PATH of
# the systemd user manager, so user services (agentuxd and the harness CLIs it
# spawns) and apps started by Plasma (the cockpit) find them, not only login
# shells (see /etc/profile.d/agentux.sh). Read by
# systemd-environment-d-generator; see environment.d(5) for the syntax.
PATH=$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH
