# agentux-hyprland image: the login screen preselects the AgentUX Hyprland
# session (/usr/share/wayland-sessions/agentux-hyprland.desktop). Plasma stays
# installed and selectable from the session menu. Preselecting wins over the
# session last used, so to make Plasma the default again choose it under
# System Settings > Login Screen > Behavior (written to /etc/plasmalogin.conf,
# which overrides this file).
[Greeter]
PreselectedSession=agentux-hyprland.desktop
