name: Live ISO

# Builds the AgentUX live ISO (try it without installing, then install from
# the live session) with Titanoboa: live/Containerfile turns a published
# image into the live environment, Titanoboa squashes it into a bootable ISO.
# The amd64 ISO is then booted in QEMU/KVM and tested (tests/live-vm.sh):
# the live desktop, the fake-agents demo, and an install from the live
# session to the VM's disk.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Image variant
        type: choice
        options: [plasma, cosmic]
        default: plasma
      arch:
        description: Architecture (arm64 builds the ISO but cannot boot-test it without KVM on the runner)
        type: choice
        options: [amd64, arm64, both]
        default: amd64
      image:
        description: Image to build the live ISO from instead of the variant's :latest (e.g. a test-<sha> tag or a digest)
        default: ""
      channel:
        description: Channel the installed system follows (stable falls back to latest while no :stable exists)
        type: choice
        options: [latest, stable]
        default: latest
      install-test:
        description: Also install from the live session to the test VM's disk
        type: boolean
        default: true
      publish:
        description: Publish the ISO on download.agentuxos.org (iso/nightly/; only from main)
        type: boolean
        default: false
  # A v* tag: release.yml calls this with the tag's candidate digest and the
  # stable channel, and publishes the ISOs itself once the release is approved.
  workflow_call:
    inputs:
      variant:
        type: string
        default: plasma
      arch:
        type: string
        default: both
      image:
        type: string
        default: ""
      channel:
        type: string
        default: latest
  schedule:
    - cron: "0 9 * * 1" # weekly, Monday, after the nightly image build
  # Check that the live ISO still builds and boots when its definition changes.
  pull_request:
    paths:
      - .github/workflows/live.yml
      - .github/scripts/pull.sh
      - live/**
      - tests/live*
      - tests/qga.py
      - .github/scripts/channel.sh

env:
  # What the live system is built from: an explicit image (release.yml passes
  # the tag's digest), or the variant's :latest.
  IMAGE: ${{ inputs.image || (inputs.variant == 'cosmic' && 'ghcr.io/agentux-os/agentux-cosmic:latest') || 'ghcr.io/agentux-os/agentux:latest' }}
  REPO: ${{ inputs.variant == 'cosmic' && 'ghcr.io/agentux-os/agentux-cosmic' || 'ghcr.io/agentux-os/agentux' }}
  CHANNEL: ${{ inputs.channel || 'latest' }}
  # The ISO's file name: agentux-<desktop>-live-<version>-<arch>, as the
  # installer ISOs are agentux-<desktop>-installer-<version>-<arch>.
  ISO_PREFIX: agentux-${{ inputs.variant || 'plasma' }}-live
  LIVE_IMAGE: localhost/agentux-live:ci
  # ublue-os/titanoboa, pinned (main of 2026-05-19, "Only use container
  # images as the only source of truth"); its helper container too.
  TITANOBOA_HELPER: quay.io/fedora/fedora:latest

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - id: matrix
        env:
          ARCH: ${{ inputs.arch || 'amd64' }}
        run: |
          amd='{"arch":"x86_64","goarch":"amd64","runner":"ubuntu-24.04","packages":"qemu-system-x86 qemu-utils ovmf"}'
          arm='{"arch":"aarch64","goarch":"arm64","runner":"ubuntu-24.04-arm","packages":"qemu-system-arm qemu-utils qemu-efi-aarch64"}'
          # Tags (release.yml) ask for both architectures.
          if [ "$ARCH" = both ]; then include="[$amd,$arm]"
          elif [ "$ARCH" = arm64 ]; then include="[$arm]"
          else include="[$amd]"; fi
          echo "include=$include" >> "$GITHUB_OUTPUT"

  live:
    name: live (${{ matrix.arch }})
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # The channel the installed system follows (TRACK_IMAGE) and what the
      # live installer pulls (INSTALL_IMAGE): a release ISO installs the
      # tag's digest and follows :stable (see .github/scripts/channel.sh).
      - name: Pick the channel
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/channel.sh

      # The image, the live layer, the squashfs and the ISO need far more
      # than the ~20 GB a fresh runner has free.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/.ghcup /usr/local/share/powershell /usr/local/julia* \
            /usr/lib/jvm /opt/microsoft /opt/google /opt/az
          sudo docker image prune --all --force
          df -h /

      # Titanoboa runs rootful podman and reads the image from root's
      # container storage.
      - name: Pull images
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | sudo podman login ghcr.io --username "${{ github.actor }}" --password-stdin
          sudo .github/scripts/pull.sh "$IMAGE" "$TITANOBOA_HELPER"
          test "$(sudo podman image inspect --format '{{.Architecture}}' "$IMAGE")" = "${{ matrix.goarch }}"

      - name: Build the live environment
        run: |
          sudo podman build --build-arg BASE_IMAGE="$IMAGE" \
            --build-arg INSTALL_IMAGE="$INSTALL_IMAGE" --build-arg TRACK_IMAGE="$TRACK_IMAGE" \
            -f live/Containerfile --tag "$LIVE_IMAGE" .
          sudo podman image ls

      - name: Build the ISO (Titanoboa)
        id: titanoboa
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: ${{ env.LIVE_IMAGE }}

      # Titanoboa's ISO boots UEFI only. On x86_64, live/bios-iso.sh adds
      # GRUB for BIOS (El Torito and a hybrid MBR, for CDs and dd-written USB
      # sticks) with the live image's own GRUB i386-pc modules and an El
      # Torito core image made by its grub2-mkimage; the UEFI boot, shim and
      # the menu stay as they are.
      - name: Add BIOS boot
        if: matrix.arch == 'x86_64'
        env:
          ISO: ${{ steps.titanoboa.outputs.iso-dest }}
        run: |
          mkdir -p "$RUNNER_TEMP/grub-bios"
          sudo podman run --rm --security-opt label=disable \
            -v "$RUNNER_TEMP/grub-bios:/out" "$LIVE_IMAGE" \
            sh -euxc 'cp -r /usr/lib/grub/i386-pc /out/
                      grub2-mkimage -O i386-pc-eltorito -d /usr/lib/grub/i386-pc \
                        -o /out/eltorito.img -p /boot/grub2 iso9660 biosdisk
                      rpm -q grub2-pc-modules'
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/grub-bios"
          # Room for the rewritten ISO; the images are not needed anymore.
          sudo podman rmi --all --force >/dev/null || true
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xorriso fdisk
          live/bios-iso.sh "$ISO" "$ISO.bios" "$RUNNER_TEMP/grub-bios"
          mv "$ISO.bios" "$ISO"
          echo "x86_64 ISO boots BIOS (GRUB i386-pc El Torito, hybrid MBR) and UEFI" >> "$GITHUB_STEP_SUMMARY"

      - name: Name and checksum the ISO
        id: iso
        run: |
          # A tag build is named after the tag (its download links are known in
          # advance), any other after the day.
          version="$(date -u +%Y%m%d)"
          if [[ $GITHUB_REF == refs/tags/v* ]]; then version=$GITHUB_REF_NAME; fi
          name="${ISO_PREFIX}-${version}-${{ matrix.arch }}"
          mv "${{ steps.titanoboa.outputs.iso-dest }}" "$name.iso"
          sha256sum "$name.iso" > "$name.iso.sha256"
          ls -lh "$name.iso"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ISO \`$name.iso\` ($(du -h "$name.iso" | cut -f1)), installs \`$INSTALL_IMAGE\` and follows \`$TRACK_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          # Room for the test VM; the images are not needed anymore.
          sudo podman rmi --all --force >/dev/null || true
          df -h /

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.iso.outputs.name }}
          path: |
            ${{ steps.iso.outputs.name }}.iso
            ${{ steps.iso.outputs.name }}.iso.sha256
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      # Hosted x64 runners have KVM, but /dev/kvm is root-only until this
      # rule (as documented by GitHub) opens it up. GitHub's arm64 runners
      # may have none; their ISO is built but not booted.
      - name: Enable KVM
        id: kvm
        run: |
          if [ ! -e /dev/kvm ]; then
            if [ "${{ matrix.goarch }}" = amd64 ]; then
              echo "::error::no /dev/kvm on this runner"
              exit 1
            fi
            echo "::notice::no /dev/kvm on the ${{ matrix.arch }} runner; the live ISO is built but not booted"
            echo "Live test (${{ matrix.arch }}) skipped: the runner has no KVM." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          # The rule applies asynchronously now and then; don't race it.
          for _ in $(seq 10); do test -w /dev/kvm && break; sleep 1; done
          test -w /dev/kvm || sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
          test -w /dev/kvm
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Install QEMU and UEFI firmware
        if: steps.kvm.outputs.ok == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ${{ matrix.packages }}

      - name: Boot and test the live ISO
        if: steps.kvm.outputs.ok == 'true'
        env:
          LIVE_TEST_INSTALL: ${{ (github.event_name != 'workflow_dispatch' || inputs.install-test) && '1' || '0' }}
          LIVE_TEST_VARIANT: ${{ inputs.variant || 'plasma' }}
          LIVE_TRACK_IMAGE: ${{ env.TRACK_IMAGE }}
        run: tests/live-vm.sh "${{ steps.iso.outputs.name }}.iso" output/live-test

      - name: Summary
        if: always() && steps.kvm.outputs.ok == 'true'
        run: |
          if [[ -f output/live-test/summary.md ]]; then
            cat output/live-test/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The live test did not get far enough to write a summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: always() && steps.kvm.outputs.ok == 'true'
        with:
          name: live-test-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            output/live-test/*.png
            output/live-test/boot/
            output/live-test/installed-boot/
            output/live-test/*.log
            output/live-test/*.txt
            output/live-test/summary.md
          retention-days: 14
          if-no-files-found: warn

  # The x86_64 ISO again, on a legacy BIOS VM (QEMU's SeaBIOS, no OVMF): as
  # a USB stick written with dd (the hybrid MBR), then from the CD with the
  # same live checks, the install to the VM's disk and the installed disk's
  # first boot, all with BIOS. VirtualBox and many other VMs default to BIOS.
  live-bios:
    name: live (x86_64, BIOS)
    needs: [matrix, live]
    # Also when the UEFI test failed: the ISO is uploaded before it runs.
    if: ${{ !cancelled() && contains(needs.matrix.outputs.include, 'x86_64') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Pick the channel
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/channel.sh

      # This run's x86_64 ISO, as the live job built and tested it.
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.ISO_PREFIX }}-*-x86_64
          path: ${{ runner.temp }}/iso
          merge-multiple: true

      - name: Check the ISO
        id: iso
        run: |
          cd "$RUNNER_TEMP/iso"
          sha256sum --check ./*.iso.sha256
          iso="$(ls ./*.iso)"
          echo "path=$RUNNER_TEMP/iso/${iso#./}" >> "$GITHUB_OUTPUT"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          for _ in $(seq 10); do test -w /dev/kvm && break; sleep 1; done
          test -w /dev/kvm || sudo chmod 0666 /dev/kvm
          test -w /dev/kvm

      - name: Install QEMU and SeaBIOS
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils seabios fdisk

      - name: Boot and test the live ISO with BIOS
        env:
          LIVE_TEST_FIRMWARE: bios
          LIVE_TEST_INSTALL: ${{ (github.event_name != 'workflow_dispatch' || inputs.install-test) && '1' || '0' }}
          LIVE_TEST_VARIANT: ${{ inputs.variant || 'plasma' }}
          LIVE_TRACK_IMAGE: ${{ env.TRACK_IMAGE }}
        run: tests/live-vm.sh "${{ steps.iso.outputs.path }}" output/live-test

      - name: Summary
        if: always()
        run: |
          if [[ -f output/live-test/summary.md ]]; then
            cat output/live-test/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The BIOS live test did not get far enough to write a summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-test-x86_64-bios-${{ github.run_id }}
          path: |
            output/live-test/*.png
            output/live-test/boot/
            output/live-test/usb-boot/
            output/live-test/installed-boot/
            output/live-test/*.log
            output/live-test/*.txt
            output/live-test/summary.md
          retention-days: 14
          if-no-files-found: warn

  # The weekly build and a dispatch with publish set go to iso/nightly/ on
  # download.agentuxos.org (.github/scripts/publish-iso.sh), only once every
  # ISO of the run built and the amd64 one passed its tests (UEFI and BIOS).
  # Its R2 credentials live in the `nightly` environment, which only main can
  # use. Tags are published by release.yml, after approval.
  publish:
    needs: [live, live-bios]
    # live-bios is skipped for an arm64-only dispatch.
    if: >-
      ${{ !cancelled() && needs.live.result == 'success'
      && (needs.live-bios.result == 'success' || needs.live-bios.result == 'skipped')
      && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: nightly
    permissions:
      contents: read
      actions: read # the ISO artifacts of this run
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@v4.1.2
      # This run's ISOs, as their jobs uploaded (and tested) them.
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.ISO_PREFIX }}-2*
          path: ${{ runner.temp }}/isos
          merge-multiple: true
      - name: Publish the ISOs
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-iso.sh nightly "$RUNNER_TEMP/isos"
